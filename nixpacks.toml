[phases.setup]
nixPkgs = ["python3", "postgresql_16.dev", "gcc"]

[phases.install]
cmds = ["python -m venv --copies /opt/venv && . /opt/venv/bin/activate && pip install -r webbuilder-main/requirements.txt"]

[phases.build]

[start]
cmd = "cd webbuilder-main && python create_tables.py && uvicorn main:app --host 0.0.0.0 --port $PORT"
