# Railway configuration for AcademicChain API

[build]
# Use the vendored Dockerfile (node:20-alpine). Nixpacks was failing to
# provide a node runtime at container start ("node: command not found"),
# so we build from the known-good Dockerfile instead.
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[env]
# Expose 3000 inside the service (Railway will map externally)
PORT = "3000"
NODE_ENV = "production"

[deploy]
# Command to start the server
startCommand = "node api/server.js"
restartPolicyType = "ON_FAILURE"
healthcheckPath = "/"
healthcheckTimeout = 300
numReplicas = 1

# Optional: name the service for clarity
[service]
name = "academicchain-api"
internal_port = 3000
